<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- type must match the file format: logo.png is a PNG, not SVG -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <!--
      Fonts load off the critical path: one combined request (halves the
      round trips), preloaded early but applied only once fetched, so first
      paint never waits on the font CSS. display=swap renders text in the
      fallback face immediately and swaps when ready.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cliqo is a COD-first Algerian marketplace: shop online, pay cash on delivery or by card, and track your order in real time."
    />
    <title>Cliqo</title>
    <script>
      // Apply the persisted language and direction before first paint so
      // direct visits (including /admin) never flash the wrong direction.
      (function () {
        try {
          var lang = localStorage.getItem("i18nextLng") || "en";
          if (["en", "fr", "ar"].indexOf(lang) === -1) lang = "en";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {
          /* localStorage unavailable — keep defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
